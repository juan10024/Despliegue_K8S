name: Pipeline CI/CD GitOps

# El pipeline se ejecutará automáticamente cada push a la rama main
on:
  push:
    branches:
      - main

# Permisos necesarios para que el pipeline pueda escribir y hacer commits en el repositorio
permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
    # Descargar el código del repositorio en la máquina virtual del pipeline
    - name: Checkout del código
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    # Autenticarse en Docker Hub usando los secretos configurados
    - name: Iniciar sesión en Docker Hub
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}

    # Construir y subir la imagen de Docker usando el commit SHA como Tag único
    - name: Construir y empaquetar imagen Docker
      uses: docker/build-push-action@v5
      with:
        context: ./src
        file: ./src/Dockerfile
        push: true
        # Se generan dos tags: 'latest' y uno único con el hash del commit
        tags: |
          ${{ secrets.DOCKERHUB_USERNAME }}/mi-api-python:latest
          ${{ secrets.DOCKERHUB_USERNAME }}/mi-api-python:${{ github.sha }}

    # Automatización GitOps: Actualizar el tag de la imagen en el archivo values.yaml de Helm
    - name: Actualizar Tag en Helm (values.yaml)
      run: |
        # Reemplaza la línea del tag vieja por el nuevo commit SHA usando sed
        sed -i 's/tag: .*/tag: "${{ github.sha }}"/g' deploy/helm/mi-api-chart/values.yaml
        
        # También actualiza el repositorio por si se cambió el usuario
        sed -i 's|repository: .*|repository: '${{ secrets.DOCKERHUB_USERNAME }}'/mi-api-python|g' deploy/helm/mi-api-chart/values.yaml

    # Hacer commit y push del cambio del archivo values.yaml de vuelta a GitHub
    - name: Confirmar cambios en el repositorio (Commit GitOps)
      run: |
        git config --global user.name "GitHub Actions Bot"
        git config --global user.email "actions@github.com"
        git add deploy/helm/mi-api-chart/values.yaml
        
        # El pipeline solo hará commit si el archivo values.yaml realmente cambió
        git diff-index --quiet HEAD || git commit -m "GitOps: Automatizado - Actualización de imagen a versión ${{ github.sha }} [skip ci]"
        git push